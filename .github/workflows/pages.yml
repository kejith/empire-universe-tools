name: GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Statische Tools veröffentlichen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Nur öffentliche HTML-, CSS- und JavaScript-Dateien bereitstellen
        run: |
          mkdir -p _site/asteroiden-mining-flottenoptimierer _site/datenbank
          cp index.html _site/
          cp asteroiden-mining-flottenoptimierer/index.html _site/asteroiden-mining-flottenoptimierer/
          cp asteroiden-mining-flottenoptimierer/verbesserungen.css _site/asteroiden-mining-flottenoptimierer/
          cp asteroiden-mining-flottenoptimierer/verbesserungen.js _site/asteroiden-mining-flottenoptimierer/
          cp asteroiden-mining-flottenoptimierer/datenbank-anbindung.js _site/asteroiden-mining-flottenoptimierer/
          cp asteroiden-mining-flottenoptimierer/optimizer-worker.js _site/asteroiden-mining-flottenoptimierer/
          cp datenbank/index.html datenbank/app.js datenbank/style.css datenbank/referenzdaten.json _site/datenbank/

      - name: Webseite packen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
